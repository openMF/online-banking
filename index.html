luye un flujo de segunda firma. Todas estas acciones son locales y no mueven dinero real.":"In this experience, you can explore balances and transactions, add beneficiaries, simulate transfers, download demo receipts, and export transactions to CSV. The business version includes a second-approval flow. Every action is local and moves no real money.","¿Cuáles son las comisiones y las tasas?":"What are the fees and rates?","Las comisiones, tasas, GAT, CAT, montos y plazos reales varían según el producto y las condiciones vigentes. No publicamos valores oficiales no verificados. Solicita la información actual directamente a MIFOS antes de contratar. Los simuladores usan tasas hipotéticas claramente indicadas.":"Actual fees, rates, GAT, CAT, amounts, and terms vary by product and current conditions. We do not publish unverified official figures. Request current information directly from MIFOS before signing. Calculators use clearly disclosed hypothetical rates.","¿Esta experiencia opera con dinero real?":"Does this experience use real money?","No. Este es un prototipo de experiencia digital inspirado en Mifos Online Banking. Los perfiles, saldos, transferencias, verificaciones e historias son ilustrativos. No está conectado a sistemas bancarios y no abre cuentas ni realiza operaciones reales. Utiliza únicamente datos de prueba.":"No. This is a digital experience prototype inspired by Mifos Online Banking. Profiles, balances, transfers, verification steps, and stories are illustrative. It is not connected to banking systems and does not open accounts or perform real transactions. Use test data only.","MIFOS. SIEMPRE DE TU LADO.":"MIFOS. ALWAYS ON YOUR SIDE.","El siguiente paso":"The next step","es tuyo.":"is yours.","Tu futuro no espera. Hagamos que suceda.":"Your future will not wait. Let's make it happen.","Comienza hoy":"Start today","Un paso adelante":"One step ahead","Para tu empresa":"For your business","Conoce MIFOS":"Discover MIFOS","De nuestro lado":"About us","
