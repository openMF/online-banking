 investment solutions. Review its current institutional and regulatory information at mifos.com.mx.","¿Cómo puedo abrir una cuenta?":"How can I open an account?","Con el botón \\"Abre tu cuenta\\" puedes explorar un registro de demostración. Para abrir una cuenta real, visita el sitio oficial o contacta a un asesor al 477 461 4700. Los requisitos, disponibilidad y condiciones dependen del producto y de la validación de identidad correspondiente.":"Use the \\"Open your account\\" button to explore a demonstration signup. To open a real account, visit the official website or call an advisor at 477 461 4700. Requirements, availability, and terms depend on the product and applicable identity verification.","¿Cómo está protegido mi ahorro?":"How are my savings protected?","Los depósitos elegibles de una SOFIPO están protegidos por el Fondo de Protección hasta por 25,000 UDIS por persona y por institución, conforme a las disposiciones aplicables. Consulta los alcances y exclusiones en los canales oficiales. Los saldos de esta demo son ficticios y no son depósitos.":"Eligible SOFIPO deposits are protected by the Protection Fund up to 25,000 UDIS per person, per institution, under applicable rules. Review coverage and exclusions through official channels. Demo balances are fictional and are not deposits.","¿Qué puedo hacer en la banca digital?":"What can I do in digital banking?","En esta experiencia puedes explorar saldos y movimientos, agregar beneficiarios, simular transferencias, descargar comprobantes de prueba y exportar movimientos a CSV. La versión empresarial incluye un flujo de segunda firma. Todas estas acciones son locales y no mueven dinero real.":"In this experience, you can explore balances and transactions, add beneficiaries, simulate transfers, download demo receipts, and export transactions to CSV. The business version includes a second-approval flow. Every action is local and moves no real money.","¿Cuáles son las comisiones y las tasas?":"What are the fees and rates?","Las comisiones, tasas, GAT, CAT, montos y plazos reales varían según el producto y las condiciones vigentes. No publicamos valores oficiales no verificados. Solicita la información actual directamente a MIFOS antes de contratar. Los simuladores usan tasas hipotéticas claramente indicadas.":"Actual fees, rates, GAT, CAT, amounts, and terms vary by product and current conditions. We do not publish unverified official figures. Request current information directly from MIFOS before signing. Calculators use clearly disclosed hypothetical rates.","¿Esta experiencia opera con dinero real?":"Does this experience use real money?","No. Este es un prototipo de experiencia digital inspirado en Mifos Online Banking. Los perfiles, saldos, transferencias, verificaciones e historias son ilustrativos. No está conectado a sistemas bancarios y no abre cuentas ni realiza operaciones reales. Utiliza únicamente datos de prueba.":"No. This is a digital experience prototype inspired by Mifos Online Banking. Profiles, balances, transfers, verification steps, and stories are illustrative. It is not connected to banking systems and does not open accounts or perform real transactions. Use test data only.","MIFOS. SIEMPRE DE TU LADO.":"MIFOS. ALWAYS ON YOUR SIDE.","El siguiente paso":"The next step","es tuyo.":"is yours.","Tu futuro no espera. Hagamos que suceda.":"Your future will not wait. Let's make it happen.","Comienza hoy":"Start today","Un paso adelante":"One step ahead","Para tu empresa":"For your business","Conoce MIFOS":"Discover MIFOS","De nuestro lado":"About us","Costos y condiciones":"Costs and terms","Sitio institucional":"Corporate website","Tu ahorro protegido":"Your protected savings","Estamos contigo":"We are here for you","Preguntas frecuentes":"Frequently asked questions","Habla con un asesor":"Talk to an advisor","Tu dinero. Tu futuro.":"Your money. Your future.","Siempre de tu lado.":"Always on your side.","Orgullosamente mexicana.":"Proudly Mexican.","MIF
