ailability, and terms depend on the product and applicable identity verification.","¿Cómo está protegido mi ahorro?":"How are my savings protected?","Los depósitos elegibles de una SOFIPO están protegidos por el Fondo de Protección hasta por 25,000 UDIS por persona y por institución, conforme a las disposiciones aplicables. Consulta los alcances y exclusiones en los canales oficiales. Los saldos de esta demo son ficticios y no son depósitos.":"Eligible SOFIPO deposits are protected by the Protection Fund up to 25,000 UDIS per person, per institution, under applicable rules. Review coverage and exclusions through official channels. Demo balances are fictional and are not deposits.","¿Qué puedo hacer en la banca digital?":"What can I do in digital banking?","En esta experiencia puedes explorar saldos y movimientos, agregar beneficiarios, simular transferencias, descargar comprobantes de prueba y exportar movimientos a CSV. La versión empresarial incluye un flujo de segunda firma. Todas estas acciones son locales y no mueven dinero real.":"In this experience, you can explore balances and transactions, add beneficiaries, simulate transfers, download demo receipts, and export transactions to CSV. The business version includes a second-approval flow. Every action is local and moves no real money.","¿Cuáles son las comisiones y las tasas?":"What are the fees and rates?","Las comisiones, tasas, GAT, CAT, montos y plazos reales varían según el producto y las condiciones vigentes. No publicamos valores oficiales no verificados. Solicita la información actual directamente a MIFOS antes de contratar. Los simuladores usan tasas hipotéticas claramente indicadas.":"Actual fees, rates, GAT, CAT, amounts, and terms vary by product and current conditions. We do not publish unverified official figures. Request current information directly from MIFOS before signing. Calculators use clearly disclosed hypothetical rates.","¿Esta experiencia opera con dinero real?":"Does this experience u
