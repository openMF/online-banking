name: github-actions CI

# Controls when the action will run. 
on:
  # Triggers the workflow on push or pull request events but only for the main branch
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

# The build only reads the repository; the deploy job asks for what Pages needs.
permissions:
  contents: read

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  build:
    # The type of runner that the job will run on
    name: Run Lint and Deploy 
    runs-on: ubuntu-latest

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v6

      - name: Use Node.js 24
        uses: actions/setup-node@v6
        with:
          # no support for lts as of now with github actions.
          # issue link : https://github.com/actions/setup-node/issues/26
          node-version: '24.16.0'
      - name: Remove node_modules
        run: rm -rf node_modules

      - name: Install Dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Run unit tests
        run: npm test

      # Loads the configuration generator the way the container does (plain Node, only the files the
      # Dockerfile copies) and checks nginx.conf.
      - name: Run configuration tests
        run: node --experimental-strip-types --test tests/self-service-config.mjs

      - name: Run build
        run : npm run build

      # The repository rulesets cover every branch, gh-pages included (no direct or force push),
      # so the site is published from an artifact instead of a branch.
      - name: Upload GitHub Pages artifact
        if: ${{ github.event_name == 'push' }}
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist/

  deploy:
    name: Deploy to GitHub Pages
    if: ${{ github.event_name == 'push' }}
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # Let a deployment that started finish; a newer push deploys after it.
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
