services:
  online-banking:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_SELF_SERVICE_BASE_URL: ${SELF_SERVICE_BASE_URL:-https://demo.mifos.community}
        VITE_SELF_SERVICE_ENDPOINT: ${SELF_SERVICE_ENDPOINT:-/fineract-provider/api}
        VITE_SELF_SERVICE_API_KEY: ${SELF_SERVICE_API_KEY:-}
        VITE_SELF_SERVICE_TENANT_ID: ${SELF_SERVICE_TENANT_ID:-default}
    image: openmf/online-banking:local
    container_name: mifos-online-banking
    ports:
      - "8080:80"
    environment:
      SELF_SERVICE_BASE_URL: ${SELF_SERVICE_BASE_URL:-https://demo.mifos.community}
      SELF_SERVICE_ENDPOINT: ${SELF_SERVICE_ENDPOINT:-/fineract-provider/api}
      SELF_SERVICE_API_KEY: ${SELF_SERVICE_API_KEY:-}
      SELF_SERVICE_TENANT_ID: ${SELF_SERVICE_TENANT_ID:-default}
    restart: unless-stopped
    healthcheck:
      # Updated: Check root path "/" instead of "/health"
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 15s # Increased for Node.js SSR startup
      