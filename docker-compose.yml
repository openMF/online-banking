# Mifos Online Banking — Nginx static demo + Self Service Plugin config
#
# Usage:
#   docker compose up --build -d  # standalone demo, no .env required
#   open http://localhost:8080
#   To configure a Self Service integration, set both variables from .env.example.
#
# Stop:
#   docker compose down

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: online-banking:latest
    container_name: online-banking
    ports:
      - "8080:80"
    restart: unless-stopped
    # The health check is the HEALTHCHECK of the Dockerfile (GET /health).
    environment:
      SELF_SERVICE_BASE_URL: "${SELF_SERVICE_BASE_URL:-}"
      SELF_SERVICE_TENANT_ID: "${SELF_SERVICE_TENANT_ID:-}"
