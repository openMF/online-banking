# Mifos Online Banking — Nginx static demo + Self Service Plugin config
#
# Usage:
#   cp .env.example .env   # edit BASE_URL / ENDPOINT / API_KEY / TENANT
#   docker compose up --build -d
#   open http://localhost:8080
#
# Stop:
#   docker compose down

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: banking-landing-page:latest
    container_name: banking-landing-page
    ports:
      - "8080:80"
    restart: unless-stopped
    # Optional: environment variables if needed later
    # environment:
    #   - NODE_ENV=production
