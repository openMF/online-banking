# Mifos Online Banking — Nginx static demo + Self Service Plugin config
#
# Usage:
#   docker compose up --build -d  # standalone demo, no .env required
#   To configure a future API integration, set both variables from .env.example.
#   open http://localhost:8080
#
# Stop:
#   docker compose down

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: banking-landing-page:latest
    container_name: banking-landing-page
    ports:
      - "8080:80"
    restart: unless-stopped
    environment:
      SELF_SERVICE_BASE_URL: "${SELF_SERVICE_BASE_URL:-}"
      SELF_SERVICE_TENANT_ID: "${SELF_SERVICE_TENANT_ID:-}"
